<script>
let currentDate = new Date().toISOString().slice(0,10);
let currentType = 'masuk';
let editingId = null;
let transactions = [];

const datePicker = document.getElementById('datePicker');
const overlay = document.getElementById('overlay');
const transForm = document.getElementById('transForm');
const transTable = document.getElementById('transTable');
const toast = document.getElementById('toast');

datePicker.value = currentDate;

function fmtRupiah(n){
  return 'Rp ' + Math.round(n).toLocaleString('id-ID');
}

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 2200);
}

// LOAD DATA DARI GITHUB VIA NETLIFY FUNCTION
async function loadTransactions(date){
  try{
    const res = await fetch(`/.netlify/functions/transaksi?date=${date}`);
    const data = await res.json();
    transactions = Array.isArray(data) ? data : [];
  }catch(e){
    transactions = [];
  }
  renderAll();
}

// SIMPAN DATA KE GITHUB VIA NETLIFY FUNCTION
async function saveTransactions(){
  try{
    await fetch(`/.netlify/functions/transaksi?date=${currentDate}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(transactions)
    });
  }catch(e){
    showToast('Gagal menyimpan data ke GitHub. Coba lagi.');
  }
}

function renderAll(){
  transactions.sort((a,b)=> a.waktu.localeCompare(b.waktu));

  let masuk = 0, keluar = 0;
  transactions.forEach(t=>{
    if(t.tipe === 'masuk') masuk += Number(t.nominal);
    else keluar += Number(t.nominal);
  });
  document.getElementById('totalMasuk').textContent = fmtRupiah(masuk);
  document.getElementById('totalKeluar').textContent = fmtRupiah(keluar);
  document.getElementById('totalSaldo').textContent = fmtRupiah(masuk - keluar);

  if(transactions.length === 0){
    transTable.innerHTML = '<tr class="empty-row"><td colspan="5">Belum ada transaksi untuk tanggal ini. Tambahkan transaksi pertama.</td></tr>';
    return;
  }

  transTable.innerHTML = transactions.map(t => `
    <tr>
      <td>${formatWaktu(t.waktu)}</td>
      <td>${escapeHtml(t.keterangan)}</td>
      <td><span class="pill ${t.tipe === 'masuk' ? 'pill-in' : 'pill-out'}">${t.tipe === 'masuk' ? 'Masuk' : 'Keluar'}</span></td>
      <td class="${t.tipe === 'masuk' ? 'nominal-in' : 'nominal-out'}">${t.tipe === 'masuk' ? '+' : '-'}${fmtRupiah(t.nominal)}</td>
      <td>
        [<span class="action-link" onclick="openEdit('${t.id}')">Edit</span>
        <span class="action-link danger" onclick="deleteTrans('${t.id}')">Hapus</span>]
      </td>
    </tr>
  `).join('');
}

function formatWaktu(w){ return w + ' WIB'; }
function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function openModal(title){
  document.getElementById('modalTitle').textContent = title;
  overlay.classList.add('show');
}
function closeModal(){
  overlay.classList.remove('show');
  transForm.reset();
  editingId = null;
  setType('masuk');
}

function setType(type){
  currentType = type;
  document.getElementById('btnMasuk').classList.toggle('sel-in', type === 'masuk');
  document.getElementById('btnKeluar').classList.toggle('sel-out', type === 'keluar');
}

document.getElementById('btnMasuk').addEventListener('click', ()=>setType('masuk'));
document.getElementById('btnKeluar').addEventListener('click', ()=>setType('keluar'));

document.getElementById('openAdd').addEventListener('click', ()=>{
  editingId = null;
  transForm.reset();
  const now = new Date();
  document.getElementById('fWaktu').value = now.toTimeString().slice(0,5);
  setType('masuk');
  openModal('Tambah Transaksi');
});

document.getElementById('cancelBtn').addEventListener('click', closeModal);
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });

window.openEdit = function(id){
  const t = transactions.find(x => x.id === id);
  if(!t) return;
  editingId = id;
  document.getElementById('fWaktu').value = t.waktu;
  document.getElementById('fKeterangan').value = t.keterangan;
  document.getElementById('fNominal').value = t.nominal;
  setType(t.tipe);
  openModal('Edit Transaksi');
};

window.deleteTrans = async function(id){
  if(!confirm('Hapus transaksi ini?')) return;
  transactions = transactions.filter(t => t.id !== id);
  await saveTransactions();
  renderAll();
  showToast('Transaksi dihapus');
};

transForm.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const waktu = document.getElementById('fWaktu').value;
  const keterangan = document.getElementById('fKeterangan').value.trim();
  const nominal = Number(document.getElementById('fNominal').value);

  if(!waktu || !keterangan || !nominal || nominal <= 0){
    showToast('Lengkapi semua data dengan benar');
    return;
  }

  if(editingId){
    const idx = transactions.findIndex(t => t.id === editingId);
    if(idx > -1){
      transactions[idx] = { ...transactions[idx], waktu, keterangan, tipe: currentType, nominal };
    }
    showToast('Transaksi diperbarui');
  }else{
    transactions.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      waktu, keterangan, tipe: currentType, nominal
    });
    showToast('Transaksi ditambahkan');
  }

  await saveTransactions();
  renderAll();
  closeModal();
});

datePicker.addEventListener('change', ()=>{
  currentDate = datePicker.value;
  loadTransactions(currentDate);
});

const navItems = document.querySelectorAll('.nav-item');
const dashboardPage = document.getElementById('dashboardPage');
const otherPage = document.getElementById('otherPage');
const pageLabels = {
  laporan: 'Halaman Laporan sedang dalam pengembangan.',
  stok: 'Halaman Stok Barang sedang dalam pengembangan.',
  pengaturan: 'Halaman Pengaturan sedang dalam pengembangan.'
};

navItems.forEach(item=>{
  item.addEventListener('click', ()=>{
    navItems.forEach(i=>i.classList.remove('active'));
    item.classList.add('active');
    const page = item.dataset.page;
    if(page === 'dashboard'){
      dashboardPage.style.display = 'block';
      otherPage.style.display = 'none';
    }else{
      dashboardPage.style.display = 'none';
      otherPage.style.display = 'block';
      otherPage.textContent = pageLabels[page];
    }
  });
});

loadTransactions(currentDate);
</script>
